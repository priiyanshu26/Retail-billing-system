# ===============================
# APPLICATION CONFIG
# ===============================
spring.application.name=billing-service
server.port=8084

# ===============================
# MYSQL DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/retail_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Priyanshu@26
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# LOGGING (OPTIONAL BUT USEFUL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# SPRING SECURITY (DISABLE DEFAULT USER)
# ===============================
spring.security.user.name=disabled
spring.security.user.password=disabled

# ===============================
# JWT CONFIG (MUST MATCH AUTH, PRODUCT, ORDER)
# ===============================
jwt.secret=mysecretkeymysecretkeymysecretkey

# ===============================
# FEIGN CLIENT CONFIG
# ===============================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

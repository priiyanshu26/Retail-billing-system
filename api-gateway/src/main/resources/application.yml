server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # ================= GLOBAL CORS CONFIG (IMPORTANT) =================
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # ================= ROUTES =================
      routes:

        # ================= AUTH SERVICE =================
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**,/api/users/**

        # ================= ORDER SERVICE =================
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        # ================= PRODUCT SERVICE =================
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/products/**, /api/categories/**

        # ================= BILLING SERVICE =================
        - id: billing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/billing/**

        # ================= PAYMENT SERVICE =================
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
